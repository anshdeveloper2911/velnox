<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, follow">

    <meta
        name="description"
        content="The page you're looking for could not be found. Return to VELNOX Web Labs."
    >

    <meta name="theme-color" content="#000000">

    <title>404 | Page Not Found — VELNOX Web Labs</title>

    <link rel="icon" type="image/png" href="/assets/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            background: #000;
            color: #fff;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        .brand {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 45px;
            opacity: 0.7;
        }

        .error-code {
            font-size: clamp(110px, 22vw, 220px);
            line-height: 0.85;
            font-weight: 900;
            letter-spacing: -10px;

            background: linear-gradient(
                180deg,
                #fff 0%,
                #777 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            user-select: none;
        }

        h1 {
            margin-top: 35px;
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 800;
            letter-spacing: -1px;
        }

        p {
            max-width: 520px;
            margin: 18px auto 0;

            color: #999;
            font-size: 16px;
            line-height: 1.7;
        }

        .actions {
            margin-top: 35px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 150px;
            padding: 13px 22px;

            border-radius: 999px;

            text-decoration: none;
            font-size: 14px;
            font-weight: 700;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
        }

        .btn-primary {
            background: #fff;
            color: #000;
        }

        .btn-secondary {
            border: 1px solid #333;
            color: #fff;
            background: transparent;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary:hover {
            background: #ddd;
        }

        .btn-secondary:hover {
            border-color: #666;
        }

        .footer {
            margin-top: 65px;

            color: #555;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        /* Ambient glow */
        .glow {
            position: fixed;
            width: 450px;
            height: 450px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background: rgba(255, 255, 255, 0.035);

            filter: blur(90px);
            border-radius: 50%;

            pointer-events: none;
            z-index: -1;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .brand {
                margin-bottom: 35px;
            }

            .error-code {
                letter-spacing: -5px;
            }

            h1 {
                margin-top: 25px;
            }

            p {
                font-size: 15px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                max-width: 260px;
            }

            .footer {
                margin-top: 45px;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <main class="container">

        <div class="brand">
            VELNOX Web Labs
        </div>

        <div class="error-code">
            404
        </div>

        <h1>
            Page Not Found
        </h1>

        <p>
            Looks like you've taken a wrong turn.
            The page you're looking for doesn't exist,
            has been moved, or is temporarily unavailable.
        </p>

        <div class="actions">

            <a href="/" class="btn btn-primary">
                Back to Home
            </a>

            <a href="/#contact" class="btn btn-secondary">
                Contact VELNOX
            </a>

        </div>

        <div class="footer">
            © 2026 VELNOX Web Labs. All rights reserved.
        </div>

    </main>

</body>
</html>
